name: Build signed APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'src/coastline/android/**'
      - 'src/coastline/public/**'
      - 'src/coastline/package.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Downloads build-tools 30.0.3 + android-30 android.jar from Google / public mirror.
      - name: Install Android build tools
        working-directory: src/coastline
        run: bash android/bootstrap-tools.sh

      # --ignore-scripts keeps @playwright/test from pulling browser binaries we do not need.
      # esbuild resolves its platform binary through optionalDependencies, so bundling still works.
      - name: Install npm dependencies
        working-directory: src/coastline
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Provide signing keystore
        working-directory: src/coastline
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "Using keystore from ANDROID_KEYSTORE_BASE64 secret."
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.coastline-signing.keystore"
          elif [ -f keystore/coastline.jks ]; then
            echo "Using repository keystore."
            cp keystore/coastline.jks "$HOME/.coastline-signing.keystore"
          else
            echo "No keystore supplied; build-apk.sh will generate a development keystore."
          fi

      - name: Build APK
        working-directory: src/coastline
        env:
          APK_OUT: ${{ github.workspace }}/dist/Coastline-CityLife-v1.5-game.apk
          COASTLINE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'coastline' }}
          COASTLINE_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          COASTLINE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: npm run build:apk

      - name: Verify game classification in the packaged manifest
        working-directory: src/coastline
        run: |
          APK=../../dist/Coastline-CityLife-v1.5-game.apk
          TOOLS=android-tools/android-11
          echo "--- badging ---"
          "$TOOLS/aapt" dump badging "$APK" | grep -Ei "package:|application-label:|launchable-activity:|sdkVersion|targetSdkVersion"
          echo "--- manifest xmltree (relevant lines) ---"
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > xmltree.txt
          grep -Ei "appCategory|category|action" xmltree.txt || true
          echo "--- assertions ---"
          grep -q 'appCategory.*"game"' xmltree.txt \
            || { echo "FAIL: android:appCategory=game missing from packaged manifest"; exit 1; }
          grep -q 'android.intent.category.GAME' xmltree.txt \
            || { echo "FAIL: category GAME missing from packaged manifest"; exit 1; }
          grep -q 'android.intent.category.LAUNCHER' xmltree.txt \
            || { echo "FAIL: launcher category missing"; exit 1; }
          "$TOOLS/apksigner" verify --print-certs "$APK" | sed -n '1,5p'
          echo "OK: appCategory=game, GAME + LAUNCHER categories, signature verified"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coastline-v1.5-game-apk
          path: ${{ github.workspace }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30
